services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumio
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio"]
      interval: 10s
      retries: 10
  app:
    build: {context: ., target: runtime}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://lumio:${POSTGRES_PASSWORD}@db:5432/lumio
      DATABASE_SSL: "false"
      NODE_ENV: production
      DEMO_MODE: "false"
      SEED_DEMO: "false"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: {condition: service_healthy}
  scanner:
    build: {context: ., target: scanner}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://lumio:${POSTGRES_PASSWORD}@db:5432/lumio
      DATABASE_SSL: "false"
      CLAMAV_HOST: clamav
    depends_on:
      db: {condition: service_healthy}
      clamav: {condition: service_started}
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: ["clamav:/var/lib/clamav", "./deploy/clamd.conf:/etc/clamav/clamd.conf:ro"]
volumes:
  postgres:
  clamav:
